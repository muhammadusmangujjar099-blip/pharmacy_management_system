{% extends "base.html" %}
{% block title %}Suppliers - Pharmacy MS{% endblock %}
{% block content %}

<div class="page-header">
    <h2><i class="fa-solid fa-truck"></i> Suppliers</h2>
    <a href="/suppliers/add" class="btn btn-brand"><i class="fa-solid fa-plus"></i> Add Supplier</a>
</div>

<div class="table-card">
    <table class="table table-hover">
        <thead>
            <tr><th>Name</th><th>Contact</th><th>Address</th><th>Action</th></tr>
        </thead>
        <tbody>
        {% for s in suppliers %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.contact or "-" }}</td>
                <td>{{ s.address or "-" }}</td>
                <td>
                    <a href="/suppliers/edit/{{ s.id }}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></a>
                    <a href="/suppliers/delete/{{ s.id }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this supplier?')"><i class="fa-solid fa-trash"></i></a>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="4" class="text-center text-muted">No suppliers found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
