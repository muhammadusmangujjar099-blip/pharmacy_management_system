{% extends "base.html" %}
{% block title %}{{ "Edit" if customer else "Add" }} Customer{% endblock %}
{% block content %}

<div class="page-header">
    <h2><i class="fa-solid fa-users"></i> {{ "Edit" if customer else "Add" }} Customer</h2>
    <a href="/customers" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>

<div class="form-card">
    <form method="post" action="{{ '/customers/edit/' ~ customer.id if customer else '/customers/add' }}">
        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" class="form-control" value="{{ customer.contact if customer else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ customer.address if customer else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-brand"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </form>
</div>

{% endblock %}
