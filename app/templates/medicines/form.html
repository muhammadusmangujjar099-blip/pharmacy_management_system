{% extends "base.html" %}
{% block title %}{{ "Edit" if medicine else "Add" }} Medicine{% endblock %}
{% block content %}

<div class="page-header">
    <h2><i class="fa-solid fa-pills"></i> {{ "Edit" if medicine else "Add" }} Medicine</h2>
    <a href="/medicines" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>

<div class="form-card">
    <form method="post" action="{{ '/medicines/edit/' ~ medicine.id if medicine else '/medicines/add' }}">
        <div class="mb-3">
            <label class="form-label">Medicine Name</label>
            <input type="text" name="name" class="form-control" required value="{{ medicine.name if medicine else '' }}">
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" value="{{ medicine.category if medicine else 'General' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Supplier</label>
                <select name="supplier_id" class="form-select">
                    <option value="">-- Select Supplier --</option>
                    {% for s in suppliers %}
                        <option value="{{ s.id }}" {% if medicine and medicine.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock_quantity" class="form-control" value="{{ medicine.stock_quantity if medicine else 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Purchase Price (per unit)</label>
                <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{ medicine.purchase_price if medicine else 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sale Price (per unit)</label>
                <input type="number" step="0.01" name="sale_price" class="form-control" value="{{ medicine.sale_price if medicine else 0 }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Expiry Date</label>
            <input type="date" name="expiry_date" class="form-control" value="{{ medicine.expiry_date if medicine else '' }}">
        </div>
        <button type="submit" class="btn btn-brand"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </form>
</div>

{% endblock %}
