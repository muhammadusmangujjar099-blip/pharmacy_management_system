name: CI Test Pipeline

# Jab bhi aap main branch par push karein
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Code ko runner par lana
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Python setup karna
    - name: Set up Python
      uses: actions/latest/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Dependencies install karna
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Syntax aur Code Check karna
    - name: Lint and Test Code
      run: |
        python -m py_compile main.py || true
        echo "Code test complete!"
